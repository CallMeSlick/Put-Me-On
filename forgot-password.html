<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html" class="nav-pill nav-home">Home</a></li>
                <li><a href="ai-matcher.html" class="nav-pill nav-ai">🤖 AI Matcher</a></li>
                <li><a href="messages.html" class="nav-pill nav-msg">💬 Messages</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="signin.html" class="nav-pill nav-signin">Sign In</a>
                <a href="signup.html" class="nav-pill nav-signup">Sign Up</a>
                <button id="theme-button" class="nav-pill nav-theme">Theme</button>
            </div>
        </div>
    </nav>

    <div class="section-container center-page">
        <h1 style="color: #7FDBFF; margin-bottom: 10px;">Reset Password</h1>

        <div id="forgot-step-1" style="width: 100%;">
            <p style="color: #a0aec0; margin-bottom: 20px;">Enter your Gmail address to receive a password reset link.</p>
            <p id="forgot-error" style="color: #ff4136; display: none; font-weight: bold; margin-bottom: 15px;"></p>
            <form id="forgot-email-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="email" id="forgot-email" placeholder="Your Gmail Address" required style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
                <button type="submit" style="padding: 12px; font-size: 16px;">Send Reset Link</button>
            </form>
        </div>

        <div id="forgot-step-2" style="display: none; width: 100%;">
            <p style="color: #1DB954; font-weight: bold; margin-bottom: 15px;">Reset link verified! Type your new password twice.</p>
            <p id="reset-error" style="color: #ff4136; display: none; font-weight: bold; margin-bottom: 15px;"></p>
            <form id="reset-password-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="password" id="new-password" placeholder="New Password" required style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
                <input type="password" id="confirm-new-password" placeholder="Confirm New Password" required style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
                <button type="submit" style="padding: 12px; font-size: 16px;">Update Password & Sign In</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <a href="license.html">License & Disclaimer</a> |
        <a href="about.html">About</a> |
        <a href="mascot.html">Mascot</a>
    </div>

    <script src="index.js"></script>
</body>

</html>
