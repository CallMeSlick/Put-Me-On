<!DOCTYPE html>
<html>

<head>
    <title>AI Vibe Matcher - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="mascot.html">Mascot</a></li>
                <li><a href="ai-matcher.html">AI Vibe Matcher</a></li>
                <li><a href="license.html">License</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, or vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="profile.html" class="nav-post-btn">Profile</a>
                <button id="theme-button">Toggle Theme</button>
            </div>
        </div>
    </nav>

    <div class="putmeon-box" style="margin-top: 50px;">
        <div class="putmeon-title">PUT ME ON</div>
        <h2 style="color: #7FDBFF; margin-top: 10px;">🤖 AI Vibe Matcher</h2>
        <p>
            Type a description of the exact mood, feeling, or activity you're going for.
            Our AI will analyze your description and put you on to songs that match the vibe!
        </p>

        <form id="ai-vibe-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <textarea id="vibe-prompt" placeholder="e.g. 'Late night highway drive through the city with 80s synth vibes and chill vocals'..." rows="4" style="width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #7FDBFF; background: #0d0e12; color: white; resize: vertical; font-size: 15px;"></textarea>
            <button type="submit" style="align-self: center;">Get AI Recommendations</button>
        </form>

        <div id="ai-results" style="margin-top: 30px; text-align: left; display: none;">
            <h3 style="color: #b18cff;">✨ Curated Recommendations:</h3>
            <div id="ai-songs-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
