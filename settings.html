<!DOCTYPE html>
<html>

<head>
    <title>Settings - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html" class="nav-pill nav-home">Home</a></li>
                <li><a href="ai-matcher.html" class="nav-pill nav-ai">AI Matcher</a></li>
                <li><a href="messages.html" class="nav-pill nav-msg">Messages</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="signin.html" class="nav-pill nav-signin">Sign In</a>
                <a href="signup.html" class="nav-pill nav-signup">Sign Up</a>
                <button id="theme-button" class="nav-pill nav-theme">Theme</button>
                <a href="settings.html" class="nav-pill" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2);" title="Settings">⚙️</a>
            </div>
        </div>
    </nav>

    <div class="section-container center-page" style="max-width: 550px; margin-top: 30px;">
        <h1 style="color: #7FDBFF; margin-bottom: 20px;">Account Settings</h1>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 25px;">
            <img id="settings-pfp-preview" src="PutMeOnMascot.png" alt="Profile Picture" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #7FDBFF; box-shadow: 0 8px 25px rgba(0,0,0,0.5);">
            <button id="change-pfp-btn" type="button" class="nav-pill" style="background: transparent; color: #7FDBFF; border: 1px solid #7FDBFF; cursor: pointer;">Change Profile Picture</button>
            <input type="file" id="pfp-file-input" accept="image/*" style="display: none;">
        </div>

        <form id="settings-info-form" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
            
            <label style="color: #a0aec0; font-size: 12px; text-align: left;">Username</label>
            <input type="text" id="settings-username" placeholder="Username" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;" required>

            <div style="display: flex; gap: 10px;">
                <input type="text" id="settings-firstname" placeholder="First Name" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
                <input type="text" id="settings-lastname" placeholder="Last Name" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
            </div>

            <label style="color: #a0aec0; font-size: 12px; text-align: left;">Birthday</label>
            <input type="date" id="settings-birthday" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">

            <label style="color: #a0aec0; font-size: 12px; text-align: left;">Gmail Address</label>
            <input type="email" id="settings-email" placeholder="Gmail Address" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">

            <label style="color: #a0aec0; font-size: 12px; text-align: left;">Update Password</label>
            <input type="password" id="settings-password" placeholder="New Password" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">

            <button type="submit" style="padding: 12px; font-size: 15px; margin-top: 10px; cursor: pointer; font-weight: bold; background-color: #7FDBFF; color: #0d0e12; border: none; border-radius: 8px;">Save Profile Changes</button>
        </form>

        <hr style="width: 100%; margin: 30px 0; border-color: rgba(255,255,255,0.1);">

        <h2 style="color: #b18cff; margin-bottom: 20px;">Linked Music Services</h2>
        
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1DB954; padding: 14px 20px; border-radius: 12px;">
                <strong style="color: #000000; font-size: 16px;">Spotify</strong>
                <button id="link-spotify-btn" type="button" onclick="handleLinkApp('Spotify')" style="padding: 8px 16px; font-size: 13px; background-color: #000000; color: #FFFFFF; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">Link Account</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background: #FA233B; padding: 14px 20px; border-radius: 12px;">
                <strong style="color: #FFFFFF; font-size: 16px;">iTunes</strong>
                <button id="link-itunes-btn" type="button" onclick="handleLinkApp('iTunes')" style="padding: 8px 16px; font-size: 13px; background-color: #FFFFFF; color: #FA233B; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">Link Account</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; background: #FF0000; padding: 14px 20px; border-radius: 12px;">
                <strong style="color: #FFFFFF; font-size: 16px;">YouTube</strong>
                <button id="link-youtube-btn" type="button" onclick="handleLinkApp('YouTube')" style="padding: 8px 16px; font-size: 13px; background-color: #FFFFFF; color: #FF0000; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">Link Account</button>
            </div>
        </div>

        <hr style="width: 100%; margin: 30px 0; border-color: rgba(255,255,255,0.1);">

        <button type="button" onclick="signOutUser()" style="background-color: #ff4136; color: white; padding: 12px 30px; font-size: 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">Log Out of Account</button>
    </div>

    <div class="footer">
        <a href="license.html">License & Disclaimer</a> |
        <a href="about.html">About</a> |
        <a href="mascot.html">Mascot</a>
    </div>

    <script src="index.js"></script>
</body>

</html>
