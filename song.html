<!DOCTYPE html>
<html>

<head>
    <title>Song Details - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html" class="nav-pill nav-home">Home</a></li>
                <li><a href="ai-matcher.html" class="nav-pill nav-ai">AI Matcher</a></li>
                <li><a href="messages.html" class="nav-pill nav-msg">Messages</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, or vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="signin.html" class="nav-pill nav-signin">Sign In</a>
                <a href="signup.html" class="nav-pill nav-signup">Sign Up</a>
                <button id="theme-button" class="nav-pill nav-theme">Theme</button>
                <a href="settings.html" class="nav-pill" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2);" title="Settings">⚙️</a>
            </div>
        </div>
    </nav>

    <div class="section-container" style="max-width: 800px; margin-top: 40px; text-align: center;">
        <div id="song-loading" style="padding: 40px;">
            <h2>Loading Song Details...</h2>
        </div>

        <div id="song-detail-card" style="display: none; flex-direction: column; align-items: center; gap: 15px;">
            <img id="song-cover" src="" alt="Album Cover" style="width: 250px; height: 250px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <h1 id="song-title" style="font-size: 38px; margin-bottom: 0;"></h1>
            <h3 id="song-artist" style="color: #b18cff; font-size: 22px; margin-top: 5px; cursor: pointer;"></h3>
            <p id="song-album" style="color: #a0aec0; font-size: 16px; margin: 0; cursor: pointer;"></p>

            <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                <div id="song-rating-badge" class="rating-circle gray" style="width: 48px; height: 48px; font-size: 16px;">N/A</div>
                <span id="song-rating-label" style="color: #a0aec0; font-size: 14px;">No User Ratings</span>
            </div>

            <div id="audio-container" style="margin-top: 15px; width: 100%; max-width: 400px;">
                <p style="font-size: 14px; color: #7FDBFF; margin-bottom: 8px;">🎵 Audio Stream / Preview</p>
                <audio id="audio-preview" controls style="width: 100%;"></audio>
            </div>
            
            <p id="no-preview" style="display: none; color: #a0aec0; font-style: italic;">Audio stream not available for this track.</p>

            <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button id="song-like-btn" onclick="handleSongAction('like')" class="nav-pill" style="background: rgba(127,219,255,0.15); color: #7FDBFF; border: 1px solid #7FDBFF; padding: 10px 18px; cursor: pointer;">Like Track</button>
                <button id="song-dislike-btn" onclick="handleSongAction('dislike')" class="nav-pill" style="background: rgba(255,65,54,0.15); color: #ff4136; border: 1px solid #ff4136; padding: 10px 18px; cursor: pointer;">Dislike Track</button>
                <button id="song-add-btn" onclick="toggleTryOutModal()" class="nav-pill" style="background: rgba(177,140,255,0.15); color: #b18cff; border: 1px solid #b18cff; padding: 10px 18px; cursor: pointer;">+ Add to Try-Outs</button>
                <button id="song-block-btn" onclick="handleSongAction('block')" class="nav-pill" style="background: rgba(255,255,255,0.08); color: #a0aec0; border: 1px solid #a0aec0; padding: 10px 18px; cursor: pointer;">Block Track</button>
            </div>
        </div>
    </div>

    <div id="song-comments-container" class="section-container" style="display: none; max-width: 800px; margin: 30px auto; text-align: center;">
        <h2 style="color: #7FDBFF; margin-top: 0;">💬 User Reviews & Ratings</h2>
        <div id="song-comments-list" style="text-align: left; margin: 20px 0;"></div>

        <form id="song-comment-form" style="display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: auto;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <label style="color: #a0aec0;">Your Rating (1.0 to 5.0):</label>
                <input type="number" id="review-score" min="1.0" max="5.0" step="0.1" value="5.0" style="width: 70px; padding: 8px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white; text-align: center;" required>
            </div>
            <textarea id="review-text" placeholder="Write a comment about this track..." rows="3" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white; resize: vertical;" required></textarea>
            <button type="submit" style="align-self: center; padding: 10px 24px;">Post Review</button>
        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
