<!DOCTYPE html>
<html>

<head>
    <title>Artist Profile - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html" class="nav-pill nav-home">Home</a></li>
                <li><a href="ai-matcher.html" class="nav-pill nav-ai">AI Matcher</a></li>
                <li><a href="messages.html" class="nav-pill nav-msg">Messages</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, or vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="signin.html" class="nav-pill nav-signin">Sign In</a>
                <a href="signup.html" class="nav-pill nav-signup">Sign Up</a>
                <button id="theme-button" class="nav-pill nav-theme">Theme</button>
                <a href="settings.html" class="nav-pill" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2);" title="Settings">⚙️</a>
            </div>
        </div>
    </nav>

    <div class="section-container" style="max-width: 900px; margin-top: 40px; text-align: center;">
        <div id="artist-loading" style="padding: 40px;">
            <h2>Loading Artist Discography...</h2>
        </div>

        <div id="artist-profile" style="display: none; flex-direction: column; align-items: center; gap: 15px;">
            <img id="artist-img" src="" alt="Artist Photo" style="width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 3px solid #7FDBFF; box-shadow: 0 8px 25px rgba(0,0,0,0.5);">
            <h1 id="artist-name" style="font-size: 48px; margin: 10px 0 0 0;"></h1>
            <p id="artist-genres" style="color: #b18cff; font-weight: bold; margin: 0;"></p>
            <p id="artist-followers" style="color: #7FDBFF; font-size: 16px; margin-top: 5px;"></p>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button id="artist-follow-btn" onclick="toggleFollowArtist()" class="nav-pill" style="background-color: #7FDBFF; color: #0d0e12; font-weight: bold; padding: 10px 24px; cursor: pointer;">+ Follow</button>
                <button id="artist-block-btn" onclick="toggleBlockArtist()" class="nav-pill" style="background-color: rgba(255, 65, 54, 0.2); color: #ff4136; border: 1px solid #ff4136; padding: 10px 20px; cursor: pointer;">Block Artist</button>
            </div>
        </div>
    </div>

    <div id="discography-container" style="display: none; max-width: 900px; margin: 20px auto;">
        
        <div class="section-container" style="margin-bottom: 30px;">
            <h2 style="margin-top: 0; color: #7FDBFF;">🔥 Popular Tracks</h2>
            <div id="top-tracks-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; text-align: left;"></div>
        </div>

        <div class="section-container" style="margin-bottom: 30px;">
            <h2 style="margin-top: 0; color: #b18cff;">💿 Albums & Discography (Latest to Earliest)</h2>
            <div id="albums-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px;"></div>
        </div>

        <div class="section-container">
            <h2 style="margin-top: 0; color: #7FDBFF;">💬 Community Discussions & Thoughts</h2>
            <div id="comments-list" style="text-align: left; margin: 20px 0;">
                <p class="no-comments" style="color: #a0aec0; font-style: italic;">No comments yet. Be the first to share your thoughts on this artist!</p>
            </div>

            <form id="artist-comment-form" style="display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: auto;">
                <textarea id="comment-text" placeholder="What do you think of this artist's music?" rows="3" style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white; resize: vertical;" required></textarea>
                <button type="submit" style="align-self: center; padding: 10px 24px;">Post Comment</button>
            </form>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
