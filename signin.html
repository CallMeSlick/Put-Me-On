<!DOCTYPE html>
<html>

<head>
    <title>Sign In - Put Me On</title>
    <link href="reset.css" rel="stylesheet" type="text/css" />
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="PutMeOnLogo.png">
</head>

<body>
    <nav>
        <div class="nav-container">
            <ul class="navbar-links">
                <li><a href="index.html" class="nav-pill nav-home">Home</a></li>
                <li><a href="ai-matcher.html" class="nav-pill nav-ai">🤖 AI Matcher</a></li>
                <li><a href="messages.html" class="nav-pill nav-msg">💬 Messages</a></li>
            </ul>

            <div class="nav-search-container">
                <form action="search.html" method="GET" id="search-form">
                    <input type="text" name="query" id="music-search" placeholder="🔍 Search songs, artists, vibes...">
                </form>
            </div>

            <div class="nav-actions">
                <a href="signin.html" class="nav-pill nav-signin">Sign In</a>
                <a href="signup.html" class="nav-pill nav-signup">Sign Up</a>
                <button id="theme-button" class="nav-pill nav-theme">Theme</button>
            </div>
        </div>
    </nav>

    <div class="section-container center-page">
        <h1 style="color: #7FDBFF; margin-bottom: 10px;">Sign In</h1>
        <p style="color: #a0aec0; margin-bottom: 25px;">Welcome back to Put Me On!</p>

        <p id="auth-error" style="color: #ff4136; display: none; font-weight: bold; margin-bottom: 15px;"></p>

        <form id="signin-form" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
            <input type="text" id="signin-username" placeholder="Username" required style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
            <input type="password" id="signin-password" placeholder="Password" required style="padding: 12px; border-radius: 8px; border: 1px solid #7FDBFF; background: #0d0e12; color: white;">
            <button type="submit" style="padding: 12px; font-size: 16px;">Sign In</button>
        </form>

        <div style="margin-top: 20px; font-size: 14px; color: #a0aec0; display: flex; flex-direction: column; gap: 8px;">
            <p>Don't have an account? <a href="signup.html" style="color: #7FDBFF; font-weight: bold;">Sign Up Here</a></p>
            <p><a href="forgot-password.html" style="color: #b18cff;">Forgot Password?</a></p>
        </div>
    </div>

    <div class="footer">
        <a href="license.html">License & Disclaimer</a> |
        <a href="about.html">About</a> |
        <a href="mascot.html">Mascot</a>
    </div>

    <script src="index.js"></script>
</body>

</html>
